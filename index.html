<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盛文皓 - 个人经历</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0f172a; --bg2: #1e293b; --card: #1e293b; --card-hover: #263348;
  --border: rgba(148,163,184,0.1); --border-hover: rgba(56,189,248,0.3);
  --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
  --accent: #38bdf8; --accent2: #818cf8; --accent-dim: rgba(56,189,248,0.1);
  --highlight: #67e8f9; --highlight2: #a5b4fc;
  --award: #fbbf24; --inprogress: #fb923c;
  --radius: 16px; --radius-sm: 10px;
}
/* ===== Life mode theme ===== */
body.life-mode {
  --bg: #faf8f5; --bg2: #f0ece6; --card: #ffffff; --card-hover: #f7f4ef;
  --border: rgba(120,100,80,0.1); --border-hover: rgba(205,133,63,0.35);
  --text: #3d3229; --text2: #6b5e52; --text3: #9c8e80;
  --accent: #cd853f; --accent2: #d4764e; --accent-dim: rgba(205,133,63,0.08);
  --highlight: #b8602a; --highlight2: #cd853f;
  --award: #c07830; --inprogress: #d4764e;
}
body.life-mode::before {
  background:
    radial-gradient(ellipse 600px 400px at 20% 10%, rgba(205,133,63,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 500px 500px at 80% 80%, rgba(212,118,78,0.04) 0%, transparent 70%) !important;
}
body.life-mode .header::before {
  background: radial-gradient(circle, rgba(205,133,63,0.08) 0%, transparent 70%) !important;
}
body.life-mode .header h1 {
  background: linear-gradient(135deg, #cd853f 0%, #d4764e 50%, #b8602a 100%) !important;
  -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important;
}
body.life-mode .exp-period { color: #d4764e !important; background: rgba(212,118,78,0.08) !important; }
body.life-mode .side-deco { border-color: var(--accent) !important; }
body.life-mode .side-deco.left-bot { border-bottom-color: var(--accent) !important; }
body.life-mode .side-deco.right-bot { background: var(--accent2) !important; }
body.life-mode .dot-grid { background-image: radial-gradient(circle, var(--accent) 2px, transparent 2px) !important; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background 0.5s ease, color 0.5s ease;
}
body::before {
  content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse 600px 400px at 20% 10%, rgba(56,189,248,0.04) 0%, transparent 70%),
    radial-gradient(ellipse 500px 500px at 80% 80%, rgba(129,140,248,0.03) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
  animation: bgShift 20s ease-in-out infinite alternate;
  transition: background 0.5s ease;
}
@keyframes bgShift { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
.container { max-width: 860px; margin: 0 auto; padding: 60px 24px 80px; position: relative; z-index: 1; }

/* ===== Mode Toggle ===== */
.mode-toggle {
  position: fixed; top: 24px; right: 24px; z-index: 100;
  display: flex; align-items: center; gap: 10px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 30px; padding: 6px 16px 6px 12px;
  cursor: pointer; user-select: none;
  transition: all 0.3s ease;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.mode-toggle:hover { border-color: var(--border-hover); transform: translateY(-1px); }
.mode-toggle .toggle-icon { font-size: 1.1rem; transition: transform 0.4s ease; }
.mode-toggle:hover .toggle-icon { transform: rotate(15deg); }
.mode-toggle .toggle-label { font-size: 0.78rem; color: var(--text2); font-weight: 500; letter-spacing: 0.02em; }
.mode-toggle .toggle-track {
  width: 36px; height: 20px; border-radius: 10px;
  background: var(--border); position: relative;
  transition: background 0.3s;
}
.mode-toggle .toggle-thumb {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--accent); position: absolute; top: 2px; left: 2px;
  transition: transform 0.3s ease, background 0.3s;
}
body.life-mode .mode-toggle .toggle-thumb { transform: translateX(16px); background: var(--accent); }
body.life-mode .mode-toggle .toggle-track { background: rgba(205,133,63,0.2); }

/* ===== Music Player ===== */
.music-player {
  position: fixed; top: 24px; right: 180px; z-index: 100;
  display: flex; align-items: center; gap: 8px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 30px; padding: 6px 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  opacity: 0; pointer-events: none; transform: translateY(-8px);
  transition: all 0.4s ease;
}
.music-player.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
.music-btn {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--accent-dim); border: 1px solid rgba(205,133,63,0.2);
  color: var(--accent); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.25s; font-size: 0.85rem;
}
.music-btn:hover { background: rgba(205,133,63,0.15); transform: scale(1.08); }
.music-btn.playing { background: var(--accent); color: #fff; }
.music-btn.playing:hover { opacity: 0.9; }
.music-info {
  display: flex; flex-direction: column; gap: 1px;
  max-width: 140px; overflow: hidden;
}
.music-title {
  font-size: 0.72rem; color: var(--text); font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.music-artist {
  font-size: 0.62rem; color: var(--text3); font-weight: 400;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.music-progress {
  width: 100%; height: 3px; background: var(--border);
  border-radius: 2px; margin-top: 4px; cursor: pointer;
  position: relative; overflow: hidden;
}
.music-progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 2px; width: 0%; transition: width 0.3s linear;
}
/* Vinyl spin animation */
.music-btn.playing .vinyl-icon { animation: spin 2s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
/* Sound wave bars */
.sound-wave {
  display: flex; align-items: flex-end; gap: 2px; height: 14px;
}
.sound-wave span {
  width: 2px; background: var(--accent); border-radius: 1px;
  animation: wave 0.8s ease-in-out infinite;
}
.sound-wave span:nth-child(1) { height: 4px; animation-delay: 0s; }
.sound-wave span:nth-child(2) { height: 8px; animation-delay: 0.15s; }
.sound-wave span:nth-child(3) { height: 6px; animation-delay: 0.3s; }
.sound-wave span:nth-child(4) { height: 10px; animation-delay: 0.1s; }
.sound-wave.paused span { animation-play-state: paused; }
@keyframes wave {
  0%, 100% { height: 3px; }
  50% { height: 12px; }
}

/* ===== Page transition ===== */
.page-content { transition: opacity 0.4s ease, transform 0.4s ease; }
.page-content.switching { opacity: 0; transform: translateY(12px); }

/* ===== Header ===== */
.header { text-align: center; margin-bottom: 64px; position: relative; }
.header::before {
  content: ''; position: absolute; top: -80px; left: 50%; transform: translateX(-50%);
  width: 500px; height: 500px; border-radius: 50%;
  background: radial-gradient(circle, rgba(56,189,248,0.06) 0%, transparent 70%);
  pointer-events: none; transition: background 0.5s;
}
.header h1 {
  font-size: 2.8rem; font-weight: 800; letter-spacing: -0.02em;
  background: linear-gradient(135deg, #7dd3fc 0%, #38bdf8 30%, #818cf8 70%, #a78bfa 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  transition: all 0.5s;
}
.header .role { font-size: 0.95rem; color: var(--text2); margin-top: 8px; font-weight: 400; letter-spacing: 0.02em; }
.header .slogan { font-size: 0.92rem; color: var(--accent); margin-top: 16px; font-weight: 400; font-style: italic; opacity: 0.85; }
.header .contact { font-size: 0.82rem; color: var(--text3); margin-top: 10px; }

/* ===== Section ===== */
.section { margin-bottom: 56px; }
.section-title {
  font-size: 0.82rem; font-weight: 600; color: var(--accent);
  text-transform: uppercase; letter-spacing: 0.12em;
  margin-bottom: 24px; padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.section-title::before {
  content: ''; width: 3px; height: 16px; border-radius: 2px;
  background: linear-gradient(180deg, var(--accent), var(--accent2));
}

/* ===== About ===== */
.about-text { color: var(--text2); font-size: 0.95rem; line-height: 2; font-weight: 300; }

/* ===== Education ===== */
.edu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
.edu-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 22px; transition: all 0.25s;
}
.edu-card:hover { border-color: var(--border-hover); background: var(--card-hover); }
.edu-card .school { font-weight: 600; font-size: 1rem; }
.edu-card .college { color: var(--text2); font-size: 0.85rem; margin-top: 4px; font-weight: 300; }
.edu-card .degree {
  display: inline-block; background: var(--accent-dim); color: var(--accent);
  font-size: 0.72rem; padding: 2px 10px; border-radius: 20px; margin-top: 10px;
  font-weight: 500; letter-spacing: 0.02em;
}
.edu-card .period { color: var(--text3); font-size: 0.78rem; margin-top: 6px; }
.awards-list { display: flex; flex-wrap: wrap; gap: 8px; }
.award-tag {
  background: rgba(251,191,36,0.06); border: 1px solid rgba(251,191,36,0.15);
  color: var(--award); font-size: 0.78rem; padding: 5px 14px; border-radius: 20px; font-weight: 400;
}

/* ===== Experience Card ===== */
.exp-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 28px 28px 24px; margin-bottom: 16px; transition: all 0.25s;
  position: relative; overflow: hidden;
}
.exp-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  opacity: 0; transition: opacity 0.25s;
}
.exp-card:hover { border-color: var(--border-hover); background: var(--card-hover); }
.exp-card:hover::before { opacity: 1; }
.exp-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2px; }
.exp-company { font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; }
.exp-role { color: var(--accent); font-size: 0.82rem; margin-top: 2px; font-weight: 400; }
.exp-period {
  color: #fb923c; font-size: 0.76rem; white-space: nowrap;
  background: rgba(251,146,60,0.08); padding: 3px 10px; border-radius: 20px; font-weight: 400;
}
.project-tag {
  display: inline-block; font-size: 0.72rem; padding: 3px 12px; border-radius: 20px;
  margin-bottom: 10px; font-weight: 500;
}
.project-tag.award { background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.2); color: var(--award); }
.project-tag.inprogress {
  background: rgba(251,146,60,0.08); border: 1px solid rgba(251,146,60,0.25); color: var(--inprogress);
  animation: pulse-tag 2.5s ease-in-out infinite;
}
@keyframes pulse-tag { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
.exp-desc { color: var(--text2); font-size: 0.9rem; line-height: 1.9; margin: 10px 0 16px; font-weight: 300; }
.exp-desc a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(56,189,248,0.3); transition: border-color 0.2s; }
.exp-desc a:hover { border-color: var(--accent); }
.exp-details { list-style: none; padding: 0; margin: 0 0 18px; }
.exp-details li {
  color: var(--text2); font-size: 0.87rem; padding: 5px 0 5px 18px;
  position: relative; line-height: 1.85; font-weight: 300;
}
.exp-details li::before {
  content: ''; position: absolute; left: 2px; top: 13px;
  width: 6px; height: 6px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2)); opacity: 0.7;
}
.hl { color: var(--highlight); font-weight: 500; }
.tech-row { display: flex; gap: 6px; flex-wrap: wrap; }
.tech-tag {
  background: rgba(129,140,248,0.06); border: 1px solid rgba(129,140,248,0.12);
  color: var(--accent2); font-size: 0.7rem; padding: 2px 10px; border-radius: 20px;
  font-weight: 400; transition: all 0.2s;
}
.tech-tag:hover { background: rgba(129,140,248,0.12); border-color: rgba(129,140,248,0.25); }

/* ===== Skills - list ===== */
.skills-list { list-style: none; padding: 0; }
.skills-list li {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 14px 22px; margin-bottom: 8px; display: flex; align-items: flex-start;
  gap: 20px; transition: all 0.25s;
}
.skills-list li:hover { border-color: var(--border-hover); background: var(--card-hover); }
.skill-cat { font-weight: 500; color: var(--accent2); font-size: 0.82rem; min-width: 90px; flex-shrink: 0; padding-top: 1px; }
.skill-items-inline { color: var(--text2); font-size: 0.84rem; line-height: 1.7; font-weight: 300; }
.skill-note { font-size: 0.74rem; color: var(--text3); margin-left: 2px; font-style: italic; }

/* ===== Footer ===== */
.footer {
  text-align: center; margin-top: 64px; padding-top: 24px;
  border-top: 1px solid var(--border); color: var(--text3); font-size: 0.78rem;
}

/* ===== Side Decorations ===== */
.side-deco { position: fixed; z-index: 0; pointer-events: none; opacity: 0.15; transition: opacity 0.3s, border-color 0.5s; }
.side-deco.left-top { top: 8%; left: 2%; width: 180px; height: 180px; border: 2px solid var(--accent); border-radius: 50%; animation: floatA 8s ease-in-out infinite; }
.side-deco.left-mid { top: 45%; left: 3%; width: 60px; height: 60px; border: 2px solid var(--accent2); border-radius: 12px; animation: floatB 7s ease-in-out infinite; }
.side-deco.left-bot { bottom: 15%; left: 1.5%; width: 0; height: 0; border-left: 40px solid transparent; border-right: 40px solid transparent; border-bottom: 70px solid var(--accent); animation: floatC 9s ease-in-out infinite; }
.side-deco.right-top { top: 12%; right: 2%; width: 100px; height: 100px; border: 2px solid var(--accent2); border-radius: 16px; transform: rotate(15deg); animation: floatB 8s ease-in-out infinite reverse; }
.side-deco.right-mid { top: 50%; right: 3%; width: 140px; height: 140px; border: 2px solid var(--accent); border-radius: 50%; animation: floatA 9s ease-in-out infinite; }
.side-deco.right-bot { bottom: 10%; right: 2%; width: 50px; height: 50px; background: var(--accent2); border-radius: 50%; animation: floatC 6s ease-in-out infinite; }
@keyframes floatA { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-30px) rotate(8deg); } }
@keyframes floatB { 0%,100% { transform: rotate(45deg) translateY(0); } 50% { transform: rotate(55deg) translateY(-24px); } }
@keyframes floatC { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-20px) scale(1.1); } }
.dot-grid { position: fixed; z-index: 0; pointer-events: none; opacity: 0.1; }
.dot-grid.left { top: 25%; left: 1%; width: 80px; height: 200px; background-image: radial-gradient(circle, var(--accent) 2px, transparent 2px); background-size: 16px 16px; animation: gridPulse 6s ease-in-out infinite; }
.dot-grid.right { top: 60%; right: 1%; width: 80px; height: 200px; background-image: radial-gradient(circle, var(--accent2) 2px, transparent 2px); background-size: 16px 16px; animation: gridPulse 8s ease-in-out infinite 2s; }
@keyframes gridPulse { 0%,100% { opacity: 0.1; } 50% { opacity: 0.18; } }

/* ===== Currently badge ===== */
.currently-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.7rem; color: #4ade80; font-weight: 500; margin-left: 8px; vertical-align: middle; }
.currently-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #4ade80; animation: pulse-dot 2s ease-in-out infinite; }
@keyframes pulse-dot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }

/* ===== Scroll fade-in ===== */
.fade-in { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
.fade-in.visible { opacity: 1; transform: translateY(0); }

/* ===== Internship timeline ===== */
.internship-list { position: relative; padding-left: 24px; }
.internship-list::before { content: ''; position: absolute; left: 7px; top: 28px; bottom: 28px; width: 2px; background: linear-gradient(180deg, var(--accent), var(--accent2), transparent); opacity: 0.2; border-radius: 1px; }
.internship-list .exp-card { position: relative; }
.internship-list .exp-card::after { content: ''; position: absolute; left: -21px; top: 32px; width: 8px; height: 8px; border-radius: 50%; background: var(--card); border: 2px solid var(--accent); transition: background 0.25s, border-color 0.25s; }
.internship-list .exp-card:hover::after { background: var(--accent); }

/* ===== Quote block ===== */
.quote-block { border-left: 3px solid var(--accent); padding: 12px 20px; margin: 16px 0; background: var(--accent-dim); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; color: var(--text2); font-size: 0.88rem; font-style: italic; font-weight: 300; line-height: 1.8; }

/* ===== Life mode specific styles ===== */
.life-section { margin-bottom: 48px; }
.life-section-title {
  font-size: 0.82rem; font-weight: 600; color: var(--accent);
  text-transform: uppercase; letter-spacing: 0.12em;
  margin-bottom: 20px; padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.life-section-title::before {
  content: ''; width: 3px; height: 16px; border-radius: 2px;
  background: linear-gradient(180deg, var(--accent), var(--accent2));
}
.life-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 24px 28px; margin-bottom: 14px; transition: all 0.25s;
}
.life-card:hover { border-color: var(--border-hover); background: var(--card-hover); }
.life-card-title { font-weight: 600; font-size: 1rem; margin-bottom: 8px; color: var(--text); }
.life-card-desc { color: var(--text2); font-size: 0.88rem; line-height: 1.9; font-weight: 300; }
.life-tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.life-tag {
  background: var(--accent-dim); border: 1px solid rgba(205,133,63,0.15);
  color: var(--accent); font-size: 0.72rem; padding: 3px 10px; border-radius: 20px; font-weight: 400;
}
.travel-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 22px 26px; margin-bottom: 12px; transition: all 0.25s;
  border-left: 3px solid var(--accent);
}
.travel-card:hover { border-color: var(--border-hover); background: var(--card-hover); }
.travel-city { font-weight: 700; font-size: 1.05rem; color: var(--accent); margin-bottom: 6px; }
.travel-story { color: var(--text2); font-size: 0.88rem; line-height: 2; font-weight: 300; }
.life-highlight { color: var(--highlight); font-weight: 500; }

/* ===== Life images ===== */
.travel-images {
  display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;
}
.travel-images img {
  height: 100px; border-radius: var(--radius-sm); object-fit: cover;
  border: 1px solid var(--border); transition: transform 0.25s, border-color 0.25s;
  cursor: pointer;
}
.travel-images img:hover { transform: scale(1.04); border-color: var(--border-hover); }
.hobby-cover {
  height: 120px; border-radius: var(--radius-sm); object-fit: cover;
  border: 1px solid var(--border); margin-top: 12px; transition: transform 0.25s;
}
.hobby-cover:hover { transform: scale(1.02); }

/* ===== Lightbox ===== */
.lightbox {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85); z-index: 200;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
  cursor: zoom-out;
}
.lightbox.active { opacity: 1; pointer-events: auto; }
.lightbox img {
  max-width: 90vw; max-height: 85vh; border-radius: 12px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  transform: scale(0.9); transition: transform 0.3s;
}
.lightbox.active img { transform: scale(1); }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .edu-grid { grid-template-columns: 1fr; }
  .header h1 { font-size: 2rem; }
  .exp-header { flex-direction: column; gap: 4px; }
  .skills-list li { flex-direction: column; gap: 4px; }
  .container { padding: 36px 16px 60px; }
  .internship-list { padding-left: 18px; }
  .internship-list .exp-card::after { left: -15px; }
  .side-deco, .dot-grid { display: none; }
  .mode-toggle { top: 12px; right: 12px; padding: 5px 12px 5px 10px; }
  .music-player { top: 12px; right: 120px; padding: 5px 10px; }
  .music-info { max-width: 90px; }
}
</style>
</head>
<body>
<div class="side-deco left-top"></div>
<div class="side-deco left-mid"></div>
<div class="side-deco left-bot"></div>
<div class="side-deco right-top"></div>
<div class="side-deco right-mid"></div>
<div class="side-deco right-bot"></div>

  html += `<div class="footer fade-in">Made with purpose, not perfection.</div>`;
  return html;
}

function renderLife() {
  const d = lifeData;
  let html = '';
  html += `
  <div class="header fade-in">
    <h1>${d.profile.name}</h1>
    <div class="role">${d.profile.age}岁 · 生活家</div>
    <div class="slogan">"${d.profile.slogan}"</div>
  </div>`;

  // Hobbies
  html += `
  <div class="life-section fade-in">
    <div class="life-section-title">爱好</div>
    ${d.hobbies.map(h => `
      <div class="life-card fade-in">
        <div class="life-card-title">${h.title}</div>
        <div class="life-card-desc">${h.desc}</div>
        <div class="life-tag-row">${h.tags.map(t => `<span class="life-tag">${t}</span>`).join('')}</div>
        ${h.title === '追剧' ? '<img class="hobby-cover" src="./pics/苦尽柑来遇见你.jpg" alt="苦尽柑来遇见你" loading="lazy">' : ''}
      </div>`).join('')}
  </div>`;

  // Games
  html += `
  <div class="life-section fade-in">
    <div class="life-section-title">游戏</div>
    <div class="life-card fade-in">
      <div class="life-card-title">PC</div>
      <div class="life-tag-row">${d.games.pc.map(g => `<span class="life-tag">${g}</span>`).join('')}</div>
    </div>
    <div class="life-card fade-in">
      <div class="life-card-title">手游</div>
      <div class="life-tag-row">${d.games.mobile.map(g => `<span class="life-tag">${g}</span>`).join('')}</div>
    </div>
  </div>`;

  // Travel
  const travelImages = {
    '天津': [],
    '武汉': ['./pics/武汉.jpg'],
    '宣恩': ['./pics/宣恩.jpg', './pics/宣恩2.jpg', './pics/宣恩3.jpg', './pics/宣恩4.jpg'],
    '南昌': ['./pics/南昌.jpg', './pics/南昌2.jpg'],
    '长沙': ['./pics/长沙.jpg'],
    '秦皇岛 & 北戴河': ['./pics/秦皇岛.jpg', './pics/爱理想读书日.jpg'],
    '张家界': []
  };
  html += `
  <div class="life-section fade-in">
    <div class="life-section-title">旅行 · 半夜 4 点的火车</div>
    ${d.travels.map(t => `
      <div class="travel-card fade-in">
        <div class="travel-city">${t.city}</div>
        <div class="travel-story">${t.story}</div>
        ${travelImages[t.city] && travelImages[t.city].length > 0 ? `<div class="travel-images">${travelImages[t.city].map(src => `<img src="${src}" alt="${t.city}" loading="lazy">`).join('')}</div>` : ''}
      </div>`).join('')}
  </div>`;

  html += `<div class="footer fade-in">生活万岁。</div>`;
  return html;
}

function switchMode() {
  const content = document.querySelector('.page-content') || app;
  content.classList.add('switching');
  setTimeout(() => {
    currentMode = currentMode === 'work' ? 'life' : 'work';
    document.body.classList.toggle('life-mode', currentMode === 'life');
    const toggle = document.getElementById('modeToggle');
    const label = document.getElementById('toggleLabel');
    const icon = toggle.querySelector('.toggle-icon');
    if (currentMode === 'life') {
      label.textContent = '工作';
      icon.textContent = '☀️';
    } else {
      label.textContent = '生活';
      icon.textContent = '🌙';
    }
    app.innerHTML = currentMode === 'work' ? renderWork() : renderLife();
    // Re-observe fade-in elements
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
    content.classList.remove('switching');
    updateMusicVisibility();
  }, 350);
}

// Initial render
app.innerHTML = renderWork();

// Toggle handler
document.getElementById('modeToggle').addEventListener('click', switchMode);

// Scroll fade-in observer
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) entry.target.classList.add('visible');
  });
}, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

/* ===== Music Player ===== */
const bgMusic = document.getElementById('bgMusic');
const musicBtn = document.getElementById('musicBtn');
const musicPlayer = document.getElementById('musicPlayer');
const soundWave = document.getElementById('soundWave');
const progressFill = document.getElementById('musicProgressFill');
const progressBar = document.getElementById('musicProgress');
let isPlaying = false;

musicBtn.addEventListener('click', () => {
  if (isPlaying) {
    bgMusic.pause();
    musicBtn.classList.remove('playing');
    soundWave.classList.add('paused');
  } else {
    bgMusic.play().catch(() => {});
    musicBtn.classList.add('playing');
    soundWave.classList.remove('paused');
  }
  isPlaying = !isPlaying;
});

bgMusic.addEventListener('timeupdate', () => {
  if (bgMusic.duration) {
    const pct = (bgMusic.currentTime / bgMusic.duration) * 100;
    progressFill.style.width = pct + '%';
  }
});

bgMusic.addEventListener('ended', () => {
  isPlaying = false;
  musicBtn.classList.remove('playing');
  soundWave.classList.add('paused');
  progressFill.style.width = '0%';
});

progressBar.addEventListener('click', (e) => {
  if (bgMusic.duration) {
    const rect = progressBar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    bgMusic.currentTime = pct * bgMusic.duration;
  }
});

// Show/hide player based on mode
function updateMusicVisibility() {
  if (currentMode === 'life') {
    musicPlayer.classList.add('visible');
  } else {
    musicPlayer.classList.remove('visible');
    if (isPlaying) {
      bgMusic.pause();
      isPlaying = false;
      musicBtn.classList.remove('playing');
      soundWave.classList.add('paused');
    }
  }
}

/* ===== Lightbox ===== */
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');

document.addEventListener('click', (e) => {
  if (e.target.matches('.travel-images img, .hobby-cover')) {
    lightboxImg.src = e.target.src;
    lightbox.classList.add('active');
  }
  if (e.target === lightbox) {
    lightbox.classList.remove('active');
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') lightbox.classList.remove('active');
});

</script>
